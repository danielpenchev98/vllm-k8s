apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-allow-prometheus
spec:
  podSelector:
    matchLabels: {app: vllm}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {port: 8000, protocol: TCP}