apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  type: ClusterIP            # the default; can be omitted
  selector:
    app: vllm                # matches the Deployment's pod labels
  ports:
    - name: http
      port: 80               # what clients call
      targetPort: http       # the container port named "http" (8000)
