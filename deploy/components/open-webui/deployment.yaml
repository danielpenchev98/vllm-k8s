apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  selector:
    matchLabels: {app: open-webui}
  template:
    metadata:
      labels: {app: open-webui}
    spec:
      nodeSelector: {workload: cpu}
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4-slim
          env:
            - {name: OPENAI_API_BASE_URL, value: "http://litellm:4000/v1"}
            - {name: OPENAI_API_KEY, value: "sk-proj-1234567890"}
            - {name: ENABLE_OLLAMA_API, value: "false"}
            - {name: WEBUI_URL, value: "http://chat.localhost:8080"}
            - name: WEBUI_SECRET_KEY
              valueFrom: {secretKeyRef: {name: webui-secret, key: WEBUI_SECRET_KEY}}
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: open-webui-data, mountPath: /app/backend/data}
      volumes:
        - name: open-webui-data
          persistentVolumeClaim: {claimName: open-webui-data}