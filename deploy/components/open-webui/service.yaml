apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  type: ClusterIP            # the default; can be omitted
  selector:
    app: open-webui                # matches the Deployment's pod labels
  ports:
    - name: http
      port: 8080               # what clients call
      targetPort: http       # the container port named "http" (4000)
