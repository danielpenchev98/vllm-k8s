apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      nodeSelector: {workload: cpu}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.0
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml}
      volumes:
        - name: config          
          configMap: {name: litellm-config}