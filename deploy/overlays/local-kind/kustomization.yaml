namespace: llm
resources:
  - ../../base
  - model-weights-pv.yaml              # fixed host folder for the weights, survives teardown
components:
  - ../../components/vllm              # model server
  - ../../components/litellm           # gateway in front of vLLM
  - ../../components/vllm-monitoring   # ServiceMonitor for vLLM's /metrics
  - ../../components/open-webui        # web UI
secretGenerator:
  - name: hf-token
    envs: [hf.env]
    options: {disableNameSuffixHash: true}
  - name: webui-secret
    envs: [webui.env]
    options: {disableNameSuffixHash: true}
patches:
  # Bind to the static PV in model-weights-pv.yaml instead of a dynamic local-path one.
  - target: {kind: PersistentVolumeClaim, name: model-weights}
    patch: |
      - op: add
        path: /spec/storageClassName
        value: ""
      - op: add
        path: /spec/volumeName
        value: model-weights
  - target: {kind: Deployment, name: vllm}
    patch: |
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: nvidia
  - target: {kind: Ingress, name: litellm}
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: traefik
